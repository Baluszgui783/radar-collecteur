name: Collecte quotidienne
on:
  schedule:
    - cron: '17 7 * * *'
      timezone: 'Europe/Paris'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-deposit
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -q
      - name: Collecter et déposer
        env:
          SOURCE_CONFIG: ${{ secrets.SOURCE_CONFIG }}
          SITE_SERVICE: ${{ secrets.SITE_SERVICE }}
          DEPOSIT_KEY: ${{ secrets.DEPOSIT_KEY }}
          DEPOSIT_URL: ${{ secrets.DEPOSIT_URL }}
        run: python3 collect.py
